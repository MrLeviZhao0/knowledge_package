<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Android知识库 3D 可视化</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: none;
        }
        
        .node-info h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading-overlay">
        <div class="loader"></div>
        <div>正在加载3D可视化...</div>

        <p>使用鼠标拖拽旋转视角，滚轮缩放，点击节点查看详细信息。</p>
        <p>圆形节点表示目录，三角形节点表示文档。</p>
        <p>点击目录节点可展开/折叠子节点，点击文档节点可跳转到对应内容。</p>

            // 将知识库结构转换为图形数据
            function convertToGraphData(data, maxLevel = 3) {
                const nodes = [];
                const links = [];
                let nodeId = 0;
                
                // 递归处理节点
                function processNode(node, parentId = null, visible = true) {
                    const currentNodeId = `${nodeId++}`;
                    const isVisible = visible && node.level <= maxLevel;
                    
                    // 只添加可见节点
                    if (isVisible) {
                        // 添加节点
                        nodes.push({
                            id: currentNodeId,
                            name: node.name,
                            path: node.path,
                            type: node.type,
                            level: node.level,
                            parent: parentId,
                            children: node.children ? node.children.length : 0
                        });
                        
                        // 添加连接
                        if (parentId !== null) {
                            links.push({
                                source: parentId,
                                target: currentNodeId
                            });
                        }
                    }
                    
                    // 处理子节点
                    if (node.children) {
                        node.children.forEach(child => {
                            processNode(child, isVisible ? currentNodeId : parentId, isVisible && (node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel)));
                        });
                    }
                    
                    return currentNodeId;
                }
                
                processNode(data);
                
                return { nodes, links };
            }

            // 获取图形数据
            const graphData = convertToGraphData(knowledgeBase);
            console.log('生成的图形数据:', graphData);

            // 颜色映射
            const colorMap = {
                0: '#ff7f0e',      // 橙色 - 根节点
                1: '#ff7f0e',      // 橙色 - 一级目录
                2: '#2ca02c',      // 绿色 - 二级目录
                3: '#1f77b4',      // 蓝色 - 三级目录
                4: '#d62728',      // 深绿色 - 四级目录(文件)
                file: '#9467bd'     // 紫色 - 文件节点
            };

            // 创建Babylon.js引擎
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);
            
            // 创建场景
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.95, 0.95, 0.95, 1);
            
            // 创建相机
            const camera = new BABYLON.ArcRotateCamera('camera', 0, Math.PI / 3, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 200;
            
            // 创建光源
            const light1 = new BABYLON.HemisphericLight('light1', new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.7;
            
            const light2 = new BABYLON.DirectionalLight('light2', new BABYLON.Vector3(-1, -2, -1), scene);
            light2.position = new BABYLON.Vector3(20, 40, 20);
            light2.intensity = 0.3;
            
            // 存储节点和连线的引用
            const nodeMeshes = [];
            const linkLines = [];
            const labelMeshes = [];
            
            // 创建节点和标签
            graphData.nodes.forEach((node, index) => {
                // 计算节点位置（使用简单的层级布局）
                const level = node.level;
                const levelNodes = graphData.nodes.filter(n => n.level === level);
                const indexInLevel = levelNodes.findIndex(n => n.id === node.id);
                const angle = (indexInLevel / levelNodes.length) * Math.PI * 2;
                // 减小半径，使节点间距离更近
                const radius = 20 + level * 12;
                
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = -level * 10; // 减小层级间距
                
                // 根据子节点数量调整节点大小
                const childCount = node.children || 0;
                const size = node.type === 'file' ? 0.5 : Math.max(0.8, Math.min(1.5, 0.8 + childCount * 0.1));
                const nodeColor = node.type === 'file' ? colorMap.file : colorMap[level] || '#cccccc';
                
                // 调试颜色信息
                console.log(`节点 ${node.name} (level: ${level}, type: ${node.type}) 使用颜色: ${nodeColor}`);
                
                let nodeMesh;
                if (node.type === 'file') {
                    // 创建三角形节点（文件）
                    nodeMesh = BABYLON.MeshBuilder.CreateCylinder(`node-${node.id}`, {
                        height: 0.3,
                        diameterTop: 0,
                        diameterBottom: size * 2,
                        tessellation: 3
                    }, scene);
                } else {
                    // 创建球形节点（目录）
                    nodeMesh = BABYLON.MeshBuilder.CreateSphere(`node-${node.id}`, {
                        diameter: size * 2,
                        segments: 16
                    }, scene);
                }
                
                nodeMesh.position = new BABYLON.Vector3(x, y, z);
                
                // 创建材质
                const material = new BABYLON.StandardMaterial(`mat-${node.id}`, scene);
                material.diffuseColor = BABYLON.Color3.FromHexString(nodeColor.substring(1));
                material.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                material.emissiveColor = BABYLON.Color3.FromHexString(nodeColor.substring(1)).scale(0.2);
                nodeMesh.material = material;
                
                // 存储节点数据
                nodeMesh.metadata = node;
                
                // 创建标签
                const labelTexture = new BABYLON.DynamicTexture(`label-${node.id}`, {width: 256, height: 64}, scene);
                labelTexture.hasAlpha = true;
                
                const labelContext = labelTexture.getContext();
                labelContext.fillStyle = 'rgba(255, 255, 255, 0.8)';
                labelContext.fillRect(0, 0, 256, 64);
                labelContext.font = '20px Arial';
                labelContext.fillStyle = 'black';
                labelContext.textAlign = 'center';
                labelContext.fillText(node.name, 128, 40);
                
                labelTexture.update();
                
                const labelMaterial = new BABYLON.StandardMaterial(`labelMat-${node.id}`, scene);
                labelMaterial.diffuseTexture = labelTexture;
                labelMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
                labelMaterial.backFaceCulling = false;
                
                const labelPlane = BABYLON.MeshBuilder.CreatePlane(`label-${node.id}`, {width: 10, height: 2.5}, scene);
                labelPlane.position = new BABYLON.Vector3(x, y + size + 2, z);
                labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                labelPlane.material = labelMaterial;
                
                // 存储引用
                nodeMeshes.push(nodeMesh);
                labelMeshes.push(labelPlane);
            });
            
            // 创建连线
            graphData.links.forEach(link => {
                const sourceNode = graphData.nodes.find(n => n.id === link.source);
                const targetNode = graphData.nodes.find(n => n.id === link.target);
                
                if (sourceNode && targetNode) {
                    const sourceMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.source);
                    const targetMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.target);
                    
                    if (sourceMesh && targetMesh) {
                        const line = BABYLON.MeshBuilder.CreateLines(`line-${link.source}-${link.target}`, {
                            points: [
                                sourceMesh.position,
                                targetMesh.position
                            ]
                        }, scene);
                        
                        const lineMaterial = new BABYLON.StandardMaterial(`lineMat-${link.source}-${link.target}`, scene);
                        lineMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                        lineMaterial.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                        line.material = lineMaterial;
                        
                        linkLines.push(line);
                    }
                }
            });
            
            // 处理节点点击事件
            scene.onPointerObservable.add((pointerInfo) => {
                if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN && pointerInfo.pickInfo.hit) {
                    const pickedMesh = pointerInfo.pickInfo.pickedMesh;
                    
                    if (pickedMesh && pickedMesh.metadata) {
                        const node = pickedMesh.metadata;
                        console.log('点击节点:', node.name, node.type, 'level:', node.level);
                        
                        if (node.type === 'file') {
                            // 文件节点，跳转到对应文档
                            window.open(node.path, '_blank');
                        } else if (node.children > 0 && node.level >= 3) {
                            // 只有三级及以上目录节点才能展开/折叠子节点
                            toggleNodeExpansion(node);
                        }
                        
                        // 显示节点信息
                        const nodeInfo = document.getElementById('node-info');
                        document.getElementById('node-title').textContent = node.name;
                        document.getElementById('node-desc').textContent = 
                            node.type === 'file' ? 
                            `文档文件: ${node.path}` : 
                            `目录节点: ${node.children} 个子项`;
                        nodeInfo.style.display = 'block';
                    }
                }
            });
            
            // 切换节点展开/折叠状态
            function toggleNodeExpansion(node) {
                console.log('切换节点展开状态:', node.name, node.path);
                
                try {
                    // 在知识库结构中找到对应的节点并更新其展开状态
                    function findAndUpdateNode(nodeData, nodeId, path) {
                        if (nodeData.path === path) {
                            nodeData.__expanded = !nodeData.__expanded;
                            console.log('更新节点展开状态:', nodeData.name, nodeData.__expanded);
                            return true;
                        }
                        
                        if (nodeData.children) {
                            for (const child of nodeData.children) {
                                if (findAndUpdateNode(child, nodeId, path)) {
                                    return true;
                                }
                            }
                        }
                        
                        return false;
                    }
                    
                    // 更新展开状态
                    findAndUpdateNode(knowledgeBase, node.id, node.path);
                    
                    // 重新生成图形数据
                    const newGraphData = convertToGraphData(knowledgeBase);
                    console.log('重新生成的图形数据:', newGraphData);
                    
                    // 更新图形
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('切换节点展开状态时出错:', error);
                }
            }
            
            // 更新图形
            function updateGraph(newGraphData) {
                // 保存当前节点的位置
                const currentPositions = new Map();
                nodeMeshes.forEach(mesh => {
                    if (mesh.metadata) {
                        currentPositions.set(mesh.metadata.id, mesh.position.clone());
                    }
                });
                
                // 清除现有的节点和连线
                nodeMeshes.forEach(mesh => mesh.dispose());
                linkLines.forEach(line => line.dispose());
                labelMeshes.forEach(label => label.dispose());
                
                nodeMeshes.length = 0;
                linkLines.length = 0;
                labelMeshes.length = 0;
                
                // 重新创建节点和连线
                newGraphData.nodes.forEach((node, index) => {
                    // 计算节点位置
                    const level = node.level;
                    const levelNodes = newGraphData.nodes.filter(n => n.level === level);
                    const indexInLevel = levelNodes.findIndex(n => n.id === node.id);
                    const angle = (indexInLevel / levelNodes.length) * Math.PI * 2;
                    // 使用与初始创建相同的半径和间距
                    const radius = 20 + level * 12;
                    
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const y = -level * 10;
                    
                    // 创建节点
                    // 根据子节点数量调整节点大小
                    const childCount = node.children || 0;
                    const size = node.type === 'file' ? 0.5 : Math.max(0.8, Math.min(1.5, 0.8 + childCount * 0.1));
                    const nodeColor = node.type === 'file' ? colorMap.file : colorMap[level] || '#cccccc';
                    
                    // 调试颜色信息
                    console.log(`更新节点 ${node.name} (level: ${level}, type: ${node.type}) 使用颜色: ${nodeColor}`);
                    
                    let nodeMesh;
                    if (node.type === 'file') {
                        // 创建三角形节点（文件）
                        nodeMesh = BABYLON.MeshBuilder.CreateCylinder(`node-${node.id}`, {
                            height: 0.3,
                            diameterTop: 0,
                            diameterBottom: size * 2,
                            tessellation: 3
                        }, scene);
                    } else {
                        // 创建球形节点（目录）
                        nodeMesh = BABYLON.MeshBuilder.CreateSphere(`node-${node.id}`, {
                            diameter: size * 2,
                            segments: 16
                        }, scene);
                    }
                    
                    // 使用保存的位置或计算新位置
                    let position;
                    if (currentPositions.has(node.id)) {
                        // 使用保存的位置，确保节点不移动
                        position = currentPositions.get(node.id);
                    } else {
                        // 新节点，计算位置
                        position = new BABYLON.Vector3(x, y, z);
                    }
                    
                    nodeMesh.position = position;
                    
                    // 创建材质
                    const material = new BABYLON.StandardMaterial(`mat-${node.id}`, scene);
                    material.diffuseColor = BABYLON.Color3.FromHexString(nodeColor.substring(1));
                    material.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                    material.emissiveColor = BABYLON.Color3.FromHexString(nodeColor.substring(1)).scale(0.2);
                    nodeMesh.material = material;
                    
                    // 存储节点数据
                    nodeMesh.metadata = node;
                    
                    // 创建标签
                    const labelTexture = new BABYLON.DynamicTexture(`label-${node.id}`, {width: 256, height: 64}, scene);
                    labelTexture.hasAlpha = true;
                    
                    const labelContext = labelTexture.getContext();
                    labelContext.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    labelContext.fillRect(0, 0, 256, 64);
                    labelContext.font = '20px Arial';
                    labelContext.fillStyle = 'black';
                    labelContext.textAlign = 'center';
                    labelContext.fillText(node.name, 128, 40);
                    
                    labelTexture.update();
                    
                    const labelMaterial = new BABYLON.StandardMaterial(`labelMat-${node.id}`, scene);
                    labelMaterial.diffuseTexture = labelTexture;
                    labelMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
                    labelMaterial.backFaceCulling = false;
                    
                    const labelPlane = BABYLON.MeshBuilder.CreatePlane(`label-${node.id}`, {width: 10, height: 2.5}, scene);
                    // 使用与节点相同的位置逻辑，确保标签跟随节点
                    const labelPosition = position.clone();
                    labelPosition.y += size + 2;
                    labelPlane.position = labelPosition;
                    labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                    labelPlane.material = labelMaterial;
                    
                    // 存储引用
                    nodeMeshes.push(nodeMesh);
                    labelMeshes.push(labelPlane);
                });
                
                // 创建连线
                newGraphData.links.forEach(link => {
                    const sourceNode = newGraphData.nodes.find(n => n.id === link.source);
                    const targetNode = newGraphData.nodes.find(n => n.id === link.target);
                    
                    if (sourceNode && targetNode) {
                        const sourceMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.source);
                        const targetMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.target);
                        
                        if (sourceMesh && targetMesh) {
                            const line = BABYLON.MeshBuilder.CreateLines(`line-${link.source}-${link.target}`, {
                                points: [
                                    sourceMesh.position,
                                    targetMesh.position
                                ]
                            }, scene);
                            
                            const lineMaterial = new BABYLON.StandardMaterial(`lineMat-${link.source}-${link.target}`, scene);
                            lineMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                            lineMaterial.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                            line.material = lineMaterial;
                            
                            linkLines.push(line);
                        }
                    }
                });
            }
            
            // 控制按钮功能
            document.getElementById('reset-view').addEventListener('click', () => {
                camera.alpha = 0;
                camera.beta = Math.PI / 3;
                camera.radius = 100;
            });

            let linksVisible = true;
            document.getElementById('toggle-links').addEventListener('click', () => {
                linksVisible = !linksVisible;
                linkLines.forEach(line => {
                    line.setEnabled(linksVisible);
                });
            });

            let labelsVisible = true;
            document.getElementById('toggle-labels').addEventListener('click', () => {
                labelsVisible = !labelsVisible;
                labelMeshes.forEach(label => {
                    label.setEnabled(labelsVisible);
                });
            });

            // 展开所有节点
            document.getElementById('expand-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, true);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 10); // 展开到10级，相当于全部展开
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('展开所有节点时出错:', error);
                }
            });

            // 折叠所有节点
            document.getElementById('collapse-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, false);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 3); // 只显示3级
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('折叠所有节点时出错:', error);
                }
            });
            
            // 运行渲染循环
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // 处理窗口大小变化
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            // 隐藏加载消息
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
