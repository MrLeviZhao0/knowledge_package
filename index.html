<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Android知识库 3D 可视化</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        #graph-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: none;
        }
        
        .node-info h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
        
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 4px;
            color: #d32f2f;
            text-align: center;
            max-width: 80%;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 节点标签样式 */
        .node-label {
            position: absolute;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
            z-index: 100;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="graph-container">
        <div id="loading-overlay">
            <div class="loader"></div>
            <div>正在加载3D可视化...</div>
            <div style="margin-top: 10px; font-size: 14px;">如果长时间未加载，请检查浏览器控制台是否有错误信息</div>
        </div>
    </div>

        <p>圆形节点表示目录，三角形节点表示文档。</p>

            // 将知识库结构转换为图形数据
            function convertToGraphData(data, maxLevel = 3) {
                const nodes = [];
                const links = [];
                let nodeId = 0;
                
                // 递归处理节点
                function processNode(node, parentId = null, visible = true) {
                    const currentNodeId = `${nodeId++}`;
                    const isVisible = visible && node.level <= maxLevel;
                    
                    // 只添加可见节点
                    if (isVisible) {
                        // 添加节点
                        nodes.push({
                            id: currentNodeId,
                            name: node.name,
                            path: node.path,
                            type: node.type,
                            level: node.level,
                            parent: parentId,
                            children: node.children ? node.children.length : 0
                        });
                        
                        // 添加连接
                        if (parentId !== null) {
                            links.push({
                                source: parentId,
                                target: currentNodeId
                            });
                        }
                    }
                    
                    // 处理子节点
                    if (node.children) {
                        node.children.forEach(child => {
                            processNode(child, isVisible ? currentNodeId : parentId, isVisible && (node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel)));
                        });
                    }
                    
                    return currentNodeId;
                }
                
                processNode(data);
                
                return { nodes, links };
            }

            // 获取图形数据
            const graphData = convertToGraphData(knowledgeBase);
            console.log('生成的图形数据:', graphData);

            // 颜色映射
            const colorMap = {
                0: '#ff7f0e',      // 橙色 - 根节点
                1: '#ff7f0e',      // 橙色 - 一级目录
                2: '#2ca02c',      // 绿色 - 二级目录
                3: '#1f77b4',      // 蓝色 - 三级目录
                file: '#9467bd'     // 紫色 - 文件节点
            };

            console.log('开始创建3D图形');

            // 创建节点标签容器
            const labelContainer = document.createElement('div');
            labelContainer.id = 'label-container';
            labelContainer.style.position = 'absolute';
            labelContainer.style.top = '0';
            labelContainer.style.left = '0';
            labelContainer.style.width = '100%';
            labelContainer.style.height = '100%';
            labelContainer.style.pointerEvents = 'none';
            labelContainer.style.zIndex = '50';
            labelContainer.style.fontFamily = 'Arial, sans-serif';
            labelContainer.style.fontSize = '12px';
            labelContainer.style.color = '#333';
            document.getElementById('graph-container').appendChild(labelContainer);

            // 初始化3D Force Graph
            const Graph = ForceGraph3D()
                (document.getElementById('graph-container'))
                .graphData(graphData)
                .nodeLabel('') // 禁用默认标签
                .nodeAutoColorBy('level')
                .nodeColor(node => {
                    if (node.type === 'file') {
                        return colorMap.file;
                    }
                    return colorMap[node.level] || '#cccccc';
                })
                .nodeVal(node => {
                    // 根据类型和层级设置节点大小
                    if (node.type === 'file') {
                        return 3; // 文件节点较小
                    }
                    const sizeMap = { 0: 12, 1: 10, 2: 8, 3: 6 };
                    return sizeMap[node.level] || 5;
                })
                .linkColor(() => 'rgba(255,255,255,0.6)')
                .linkWidth(1)
                .onNodeClick(node => {
                    console.log('点击节点:', node.name, node.type);
                    
                    if (node.type === 'file') {
                        // 文件节点，跳转到对应文档
                        window.open(node.path, '_blank');
                    } else if (node.children > 0) {
                        // 目录节点，展开/折叠子节点
                        toggleNodeExpansion(node);
                    }
                    
                    // 显示节点信息
                    const nodeInfo = document.getElementById('node-info');
                    document.getElementById('node-title').textContent = node.name;
                    document.getElementById('node-desc').textContent = 
                        node.type === 'file' ? 
                        `文档文件: ${node.path}` : 
                        `目录节点: ${node.children} 个子项`;
                    nodeInfo.style.display = 'block';
                })
                .onBackgroundClick(() => {
                    // 隐藏节点信息
                    document.getElementById('node-info').style.display = 'none';
                });
            
            // 使用定时器更新标签，避免Three.js错误
            let labelsVisible = true;
            let updateInterval;
            
            function startLabelUpdate() {
                // 清除现有定时器
                if (updateInterval) {
                    clearInterval(updateInterval);
                }
                
                // 设置新的定时器
                updateInterval = setInterval(() => {
                    if (labelsVisible) {
                        updateNodeLabels();
                    }
                }, 100); // 每100毫秒更新一次
            }
            
            // 更新节点标签位置
            function updateNodeLabels() {
                // 清除所有现有标签
                labelContainer.innerHTML = '';
                
                if (!labelsVisible) return;
                
                try {
                    // 获取相机和场景
                    const camera = Graph.camera();
                    const scene = Graph.scene();
                    
                    // 获取画布尺寸
                    const canvas = document.querySelector('#graph-container canvas');
                    if (!canvas) return;
                    
                    const width = canvas.width;
                    const height = canvas.height;
                    
                    // 获取所有节点数据
                    const nodes = Graph.graphData().nodes;
                    
                    // 遍历所有节点
                    nodes.forEach(node => {
                        // 获取节点在3D空间中的位置
                        const position = new THREE.Vector3(
                            node.x || 0,
                            node.y || 0,
                            node.z || 0
                        );
                        
                        // 将3D位置转换为2D屏幕坐标
                        const vector = position.clone();
                        vector.project(camera);
                        
                        // 检查节点是否在相机前方
                        if (vector.z < -1 || vector.z > 1) return;
                        
                        // 转换为屏幕坐标
                        const x = (vector.x * 0.5 + 0.5) * width;
                        const y = (-vector.y * 0.5 + 0.5) * height;
                        
                        // 创建标签元素
                        const label = document.createElement('div');
                        label.className = 'node-label';
                        label.textContent = node.name;
                        label.style.left = `${x}px`;
                        label.style.top = `${y}px`;
                        
                        // 根据节点类型设置不同样式
                        if (node.type === 'file') {
                            label.style.backgroundColor = 'rgba(148, 103, 189, 0.9)'; // 紫色
                            label.style.color = 'white';
                        } else {
                            const levelColor = colorMap[node.level] || '#cccccc';
                            label.style.backgroundColor = hexToRgba(levelColor, 0.9);
                            label.style.color = 'white';
                        }
                        
                        labelContainer.appendChild(label);
                    });
                } catch (error) {
                    console.error('更新节点标签时出错:', error);
                }
            }
            
            // 将十六进制颜色转换为RGBA
            function hexToRgba(hex, alpha) {
                const r = parseInt(hex.slice(1, 3), 16);
                const g = parseInt(hex.slice(3, 5), 16);
                const b = parseInt(hex.slice(5, 7), 16);
                return `rgba(${r}, ${g}, ${b}, ${alpha})`;
            }
            
            // 切换节点展开/折叠状态
            function toggleNodeExpansion(node) {
                console.log('切换节点展开状态:', node.name, node.path);
                
                try {
                    // 在知识库结构中找到对应的节点并更新其展开状态
                    function findAndUpdateNode(nodeData, nodeId, path) {
                        if (nodeData.path === path) {
                            nodeData.__expanded = !nodeData.__expanded;
                            console.log('更新节点展开状态:', nodeData.name, nodeData.__expanded);
                            return true;
                        }
                        
                        if (nodeData.children) {
                            for (const child of nodeData.children) {
                                if (findAndUpdateNode(child, nodeId, path)) {
                                    return true;
                                }
                            }
                        }
                        
                        return false;
                    }
                    
                    // 更新展开状态
                    findAndUpdateNode(knowledgeBase, node.id, node.path);
                    
                    // 重新生成图形数据
                    const newGraphData = convertToGraphData(knowledgeBase);
                    console.log('重新生成的图形数据:', newGraphData);
                    
                    // 更新图形
                    Graph.graphData(newGraphData);
                } catch (error) {
                    console.error('切换节点展开状态时出错:', error);
                }
            }
            
            // 控制按钮功能
            document.getElementById('reset-view').addEventListener('click', () => {
                Graph.cameraPosition({ x: 0, y: 0, z: 500 }); // 重置视角
            });

            let linksVisible = true;
            document.getElementById('toggle-links').addEventListener('click', () => {
                linksVisible = !linksVisible;
                Graph.linkOpacity(linksVisible ? 1 : 0);
            });

            document.getElementById('toggle-labels').addEventListener('click', () => {
                labelsVisible = !labelsVisible;
                if (labelsVisible) {
                    updateNodeLabels();
                } else {
                    labelContainer.innerHTML = '';
                }
            });

            // 展开所有节点
            document.getElementById('expand-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, true);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 10); // 展开到10级，相当于全部展开
                    Graph.graphData(newGraphData);
                } catch (error) {
                    console.error('展开所有节点时出错:', error);
                }
            });

            // 折叠所有节点
            document.getElementById('collapse-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, false);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 3); // 只显示3级
                    Graph.graphData(newGraphData);
                } catch (error) {
                    console.error('折叠所有节点时出错:', error);
                }
            });
            
            // 隐藏加载消息
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
            
            // 启动标签更新
            setTimeout(() => {
                startLabelUpdate();
            }, 1000); // 延迟1秒启动，确保图形完全加载
        }
    </script>
</body>
</html>
