    <title>Android知识库 3D 可视化</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: none;
        }
        
        .node-info h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

            // 将知识库结构转换为图形数据
            function convertToGraphData(data, maxLevel = 3) {
                const nodes = [];
                const links = [];
                let nodeId = 0;
                
                // 递归处理节点
                function processNode(node, parentId = null, visible = true) {
                    const currentNodeId = `${nodeId++}`;
                    // 默认只显示到三级节点，且不显示文件
                    const isVisible = visible && node.level <= maxLevel && (node.type === 'folder' || node.level <= 2);
                    
                    // 只添加可见节点
                    if (isVisible) {
                        // 添加节点
                        nodes.push({
                            id: currentNodeId,
                            name: node.name,
                            path: node.path,
                            type: node.type,
                            level: node.level,
                            parent: parentId,
                            children: node.children ? node.children.length : 0
                        });
                        
                        // 添加连接
                        if (parentId !== null) {
                            links.push({
                                source: parentId,
                                target: currentNodeId
                            });
                        }
                    }
                    
                    // 处理子节点
                    if (node.children) {
                        node.children.forEach(child => {
                            processNode(child, isVisible ? currentNodeId : parentId, isVisible && (node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel)));
                        });
                    }
                    
                    return currentNodeId;
                }
                
                processNode(data);
                
                return { nodes, links };
            }

            // 获取图形数据
            const graphData = convertToGraphData(knowledgeBase, 3); // 只显示3级

            // 颜色映射
            const colorMap = {
                0: '#ff7f0e',      // 橙色 - 根节点
                1: '#ff7f0e',      // 橙色 - 一级目录
                2: '#2ca02c',      // 绿色 - 二级目录
                3: '#1f77b4',      // 蓝色 - 三级目录
                4: '#d62728',      // 深绿色 - 四级目录(文件)
                file: '#9467bd'     // 紫色 - 文件节点
            };

            // 创建Babylon.js引擎
            const canvas = document.getElementById('renderCanvas');
            const engine = new BABYLON.Engine(canvas, true);
            
            // 创建场景
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.95, 0.95, 0.95, 1);
            
            // 创建相机
            const camera = new BABYLON.ArcRotateCamera('camera', 0, Math.PI / 3, 100, BABYLON.Vector3.Zero(), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 20;
            camera.upperRadiusLimit = 200;
            
            // 创建光源
            const light1 = new BABYLON.HemisphericLight('light1', new BABYLON.Vector3(0, 1, 0), scene);
            light1.intensity = 0.7;
            
            const light2 = new BABYLON.DirectionalLight('light2', new BABYLON.Vector3(-1, -2, -1), scene);
            light2.position = new BABYLON.Vector3(20, 40, 20);
            light2.intensity = 0.3;
            
            // 存储节点和连线的引用
            const nodeMeshes = [];
            const linkLines = [];
            const labelMeshes = [];
            
            // 获取节点位置的辅助函数
            function getNodePosition(graphData, nodeId) {
                const node = graphData.nodes.find(n => n.id === nodeId);
                if (!node) return {x: 0, y: 0, z: 0};
                
                // 如果已经创建了节点，使用其位置
                const nodeMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === nodeId);
                if (nodeMesh) {
                    return {
                        x: nodeMesh.position.x,
                        y: nodeMesh.position.y,
                        z: nodeMesh.position.z
                    };
                }
                
                // 否则返回默认位置
                return {x: 0, y: -10 * (node.level || 1), z: 0};
            }
            
            // 创建节点和标签
            graphData.nodes.forEach((node, index) => {
                // 计算节点位置（使用改进的径向树布局算法）
                const level = node.level;
                
                let x, y, z;
                
                if (level === 0) {
                    // 根节点在中心
                    x = 0;
                    y = 0;
                    z = 0;
                } else if (level === 1) {
                    // 二级目录在空间中均匀分布，两对节点对称排布
                    const level1Nodes = graphData.nodes.filter(n => n.level === 1);
                    const indexInLevel = level1Nodes.findIndex(n => n.id === node.id);
                    
                    // 根据节点数量决定布局方式
                    if (level1Nodes.length === 4) {
                        // 四个节点，两两对称分布
                        switch(indexInLevel) {
                            case 0: // 第一个节点
                                x = -15;
                                z = -15;
                                break;
                            case 1: // 第二个节点，与第一个对称
                                x = 15;
                                z = -15;
                                break;
                            case 2: // 第三个节点
                                x = -15;
                                z = 15;
                                break;
                            case 3: // 第四个节点，与第三个对称
                                x = 15;
                                z = 15;
                                break;
                        }
                    } else {
                        // 其他情况，使用圆形分布
                        const angleStep = (Math.PI * 2) / level1Nodes.length;
                        const angle = indexInLevel * angleStep;
                        const radius = 15;
                        
                        x = Math.cos(angle) * radius;
                        z = Math.sin(angle) * radius;
                    }
                    
                    y = -8;
                } else {
                    // 三级及以下节点顺着二级节点方向向外生长
                    const parentNode = graphData.nodes.find(n => n.id === node.parent);
                    const parentPos = parentNode ? getNodePosition(graphData, parentNode.id) : {x: 0, y: -8, z: 0};
                    
                    // 获取同级节点
                    const siblings = graphData.nodes.filter(n => n.level === level && n.parent === node.parent);
                    const siblingIndex = siblings.findIndex(n => n.id === node.id);
                    
                    // 计算从根节点到父节点的方向向量
                    const rootToParent = {
                        x: parentPos.x,
                        z: parentPos.z
                    };
                    
                    // 计算父节点相对于根节点的角度
                    const parentAngle = Math.atan2(rootToParent.z, rootToParent.x);
                    
                    // 计算子节点分布的角度范围（在父节点方向上扩展）
                    const angleRange = Math.PI / 3; // 60度范围
                    const startAngle = parentAngle - angleRange / 2;
                    const angleStep = angleRange / Math.max(siblings.length - 1, 1);
                    const angle = startAngle + siblingIndex * angleStep;
                    
                    // 根据层级调整半径
                    const radius = 8 + level * 2;
                    
                    // 计算位置
                    x = parentPos.x + Math.cos(angle) * radius;
                    z = parentPos.z + Math.sin(angle) * radius;
                    y = -level * 5;
                }
                
                // 根据子节点数量调整节点大小
                const childCount = node.children || 0;
                const size = node.type === 'file' ? 0.5 : Math.max(0.8, Math.min(2.0, 0.8 + childCount * 0.15));
                
                let nodeMesh;
                if (node.type === 'file') {
                    // 创建三角形节点（文件）
                    nodeMesh = BABYLON.MeshBuilder.CreateCylinder(`node-${node.id}`, {
                        height: 0.3,
                        diameterTop: 0,
                        diameterBottom: size * 2,
                        tessellation: 3
                    }, scene);
                } else {
                    // 创建球形节点（目录）
                    nodeMesh = BABYLON.MeshBuilder.CreateSphere(`node-${node.id}`, {
                        diameter: size * 2,
                        segments: 16

                nodeMesh.position = new BABYLON.Vector3(x, y, z);
                
                // 创建材质
                const material = new BABYLON.StandardMaterial(`mat-${node.id}`, scene);
                
                // 判断节点是否可点击
                const isClickable = node.children > 0 && (node.level >= 2 || (node.level === 1 && hasDirectFilesInKnowledgeBase(node)));
                
                // 使用RGB值直接创建颜色，而不是FromHexString
                let babylonColor;
                if (node.type === 'file') {
                    // 紫色文件节点: #9467bd -> RGB(148, 103, 189) -> RGB(0.58, 0.40, 0.74)
                    babylonColor = new BABYLON.Color3(0.58, 0.40, 0.74);
                } else {
                    // 根据级别设置目录颜色
                    switch(level) {
                        case 0:
                        case 1:
                            // 橙色: #ff7f0e -> RGB(255, 127, 14) -> RGB(1.0, 0.50, 0.05)
                            babylonColor = new BABYLON.Color3(1.0, 0.50, 0.05);
                            break;
                        case 2:
                            // 绿色: #2ca02c -> RGB(44, 160, 44) -> RGB(0.17, 0.63, 0.17)
                            babylonColor = new BABYLON.Color3(0.17, 0.63, 0.17);
                            break;
                        case 3:
                            // 蓝色: #1f77b4 -> RGB(31, 119, 180) -> RGB(0.12, 0.47, 0.71)
                            babylonColor = new BABYLON.Color3(0.12, 0.47, 0.71);
                            break;
                        default:
                            // 默认灰色
                            babylonColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                    }
                }
                
                material.diffuseColor = babylonColor;
                material.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                
                // 可点击节点有更高的自发光，使其更明显
                if (isClickable) {
                    material.emissiveColor = babylonColor.scale(0.4);
                    material.specularColor = new BABYLON.Color3(0.5, 0.5, 0.5);
                } else {
                    material.emissiveColor = babylonColor.scale(0.2);
                }
                
                nodeMesh.material = material;
                
                // 存储节点数据
                nodeMesh.metadata = node;
                
                // 创建标签
                const labelTexture = new BABYLON.DynamicTexture(`label-${node.id}`, {width: 256, height: 64}, scene);
                labelTexture.hasAlpha = true;
                
                const labelContext = labelTexture.getContext();
                labelContext.fillStyle = 'rgba(255, 255, 255, 0.8)';
                labelContext.fillRect(0, 0, 256, 64);
                labelContext.font = '20px Arial';
                labelContext.fillStyle = 'black';
                labelContext.textAlign = 'center';
                labelContext.fillText(node.name, 128, 40);
                
                labelTexture.update();
                
                const labelMaterial = new BABYLON.StandardMaterial(`labelMat-${node.id}`, scene);
                labelMaterial.diffuseTexture = labelTexture;
                labelMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
                labelMaterial.backFaceCulling = false;
                
                const labelPlane = BABYLON.MeshBuilder.CreatePlane(`label-${node.id}`, {width: 10, height: 2.5}, scene);
                labelPlane.position = new BABYLON.Vector3(x, y + size + 2, z);
                labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                labelPlane.material = labelMaterial;
                
                // 存储引用
                nodeMeshes.push(nodeMesh);
                labelMeshes.push(labelPlane);
            });
            
            // 创建连线
            graphData.links.forEach(link => {
                const sourceNode = graphData.nodes.find(n => n.id === link.source);
                const targetNode = graphData.nodes.find(n => n.id === link.target);
                
                if (sourceNode && targetNode) {
                    const sourceMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.source);
                    const targetMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.target);
                    
                    if (sourceMesh && targetMesh) {
                        const line = BABYLON.MeshBuilder.CreateLines(`line-${link.source}-${link.target}`, {
                            points: [
                                sourceMesh.position,
                                targetMesh.position
                            ]
                        }, scene);
                        
                        const lineMaterial = new BABYLON.StandardMaterial(`lineMat-${link.source}-${link.target}`, scene);
                        lineMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                        lineMaterial.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                        line.material = lineMaterial;
                        
                        linkLines.push(line);
                    }
                }
            });
            
            // 处理节点点击事件
            scene.onPointerObservable.add((pointerInfo) => {
                if (pointerInfo.type === BABYLON.PointerEventTypes.POINTERDOWN && pointerInfo.pickInfo.hit) {
                    const pickedMesh = pointerInfo.pickInfo.pickedMesh;
                    
                    if (pickedMesh && pickedMesh.metadata) {
                        const node = pickedMesh.metadata;
                        
                        if (node.type === 'file') {
                            // 文件节点，跳转到对应文档
                            window.open(node.path, '_blank');
                        } else if (node.children > 0 && (node.level >= 2 || (node.level === 1 && hasDirectFiles(node)))) {
                            // 三级及以上目录节点可以点击，或者一级目录下有直接文件时也可以点击
                            toggleNodeExpansion(node);
                        }
                        
                        // 显示节点信息
                        const nodeInfo = document.getElementById('node-info');
                        document.getElementById('node-title').textContent = node.name;
                        document.getElementById('node-desc').textContent = 
                            node.type === 'file' ? 
                            `文档文件: ${node.path}` : 
                            `目录节点: ${node.children} 个子项`;
                        nodeInfo.style.display = 'block';
                    }
                }
            });
            
            // 检查目录下是否有直接文件
            function hasDirectFiles(node) {
                if (!node.children) return false;
                return node.children.some(child => child.type === 'file');
            }
            
            // 在知识库中检查目录下是否有直接文件
            function hasDirectFilesInKnowledgeBase(node) {
                function findNode(nodeData, path) {
                    if (nodeData.path === path) {
                        return nodeData;
                    }
                    
                    if (nodeData.children) {
                        for (const child of nodeData.children) {
                            const result = findNode(child, path);
                            if (result) return result;
                        }
                    }
                    
                    return null;
                }
                
                const nodeInKnowledgeBase = findNode(knowledgeBase, node.path);
                return nodeInKnowledgeBase ? hasDirectFiles(nodeInKnowledgeBase) : false;
            }
            
            // 切换节点展开/折叠状态
            function toggleNodeExpansion(node) {
                try {
                    // 在知识库结构中找到对应的节点并更新其展开状态
                    function findAndUpdateNode(nodeData, nodeId, path) {
                        if (nodeData.path === path) {
                            nodeData.__expanded = !nodeData.__expanded;
                            return true;
                        }
                        
                        if (nodeData.children) {
                            for (const child of nodeData.children) {
                                if (findAndUpdateNode(child, nodeId, path)) {
                                    return true;
                                }
                            }
                        }
                        
                        return false;
                    }
                    
                    // 更新展开状态
                    findAndUpdateNode(knowledgeBase, node.id, node.path);
                    
                    // 重新生成图形数据
                    const newGraphData = convertToGraphData(knowledgeBase);
                    
                    // 更新图形
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('切换节点展开状态时出错:', error);
                }
            }
            
            // 更新图形
            function updateGraph(newGraphData) {
                // 获取更新后节点位置的辅助函数
                function getUpdatedNodePosition(graphData, nodeId, currentPositions) {
                    // 如果有保存的位置，使用保存的位置
                    if (currentPositions.has(nodeId)) {
                        const pos = currentPositions.get(nodeId);
                        return {
                            x: pos.x,
                            y: pos.y,
                            z: pos.z
                        };
                    }
                    
                    // 否则返回默认位置
                    const node = graphData.nodes.find(n => n.id === nodeId);
                    return {x: 0, y: -6 * (node ? node.level : 1), z: 0};
                }
                // 保存当前节点的位置
                const currentPositions = new Map();
                nodeMeshes.forEach(mesh => {
                    if (mesh.metadata) {
                        currentPositions.set(mesh.metadata.id, mesh.position.clone());
                    }
                });
                
                // 清除现有的节点和连线
                nodeMeshes.forEach(mesh => mesh.dispose());
                linkLines.forEach(line => line.dispose());
                labelMeshes.forEach(label => label.dispose());
                
                nodeMeshes.length = 0;
                linkLines.length = 0;
                labelMeshes.length = 0;
                
                // 重新创建节点和连线
                newGraphData.nodes.forEach((node, index) => {
                    // 计算节点位置（使用改进的径向树布局算法）
                    const level = node.level;
                    
                    let x, y, z;
                    
                    if (level === 0) {
                        // 根节点在中心
                        x = 0;
                        y = 0;
                        z = 0;
                    } else if (level === 1) {
                        // 二级目录在空间中均匀分布，两对节点对称排布
                        const level1Nodes = newGraphData.nodes.filter(n => n.level === 1);
                        const indexInLevel = level1Nodes.findIndex(n => n.id === node.id);
                        
                        // 根据节点数量决定布局方式
                        if (level1Nodes.length === 4) {
                            // 四个节点，两两对称分布
                            switch(indexInLevel) {
                                case 0: // 第一个节点
                                    x = -15;
                                    z = -15;
                                    break;
                                case 1: // 第二个节点，与第一个对称
                                    x = 15;
                                    z = -15;
                                    break;
                                case 2: // 第三个节点
                                    x = -15;
                                    z = 15;
                                    break;
                                case 3: // 第四个节点，与第三个对称
                                    x = 15;
                                    z = 15;
                                    break;
                            }
                        } else {
                            // 其他情况，使用圆形分布
                            const angleStep = (Math.PI * 2) / level1Nodes.length;
                            const angle = indexInLevel * angleStep;
                            const radius = 15;
                            
                            x = Math.cos(angle) * radius;
                            z = Math.sin(angle) * radius;
                        }
                        
                        y = -8;
                    } else {
                        // 三级及以下节点顺着二级节点方向向外生长
                        const parentNode = newGraphData.nodes.find(n => n.id === node.parent);
                        const parentPos = parentNode ? getUpdatedNodePosition(newGraphData, parentNode.id, currentPositions) : {x: 0, y: -8, z: 0};
                        
                        // 获取同级节点
                        const siblings = newGraphData.nodes.filter(n => n.level === level && n.parent === node.parent);
                        const siblingIndex = siblings.findIndex(n => n.id === node.id);
                        
                        // 计算从根节点到父节点的方向向量
                        const rootToParent = {
                            x: parentPos.x,
                            z: parentPos.z
                        };
                        
                        // 计算父节点相对于根节点的角度
                        const parentAngle = Math.atan2(rootToParent.z, rootToParent.x);
                        
                        // 计算子节点分布的角度范围（在父节点方向上扩展）
                        const angleRange = Math.PI / 3; // 60度范围
                        const startAngle = parentAngle - angleRange / 2;
                        const angleStep = angleRange / Math.max(siblings.length - 1, 1);
                        const angle = startAngle + siblingIndex * angleStep;
                        
                        // 根据层级调整半径
                        const radius = 8 + level * 2;
                        
                        // 计算位置
                        x = parentPos.x + Math.cos(angle) * radius;
                        z = parentPos.z + Math.sin(angle) * radius;
                        y = -level * 5;
                    }
                    
                    // 根据子节点数量调整节点大小
                    const childCount = node.children || 0;
                    const size = node.type === 'file' ? 0.5 : Math.max(0.8, Math.min(2.0, 0.8 + childCount * 0.15));
                    const nodeColor = node.type === 'file' ? colorMap.file : colorMap[level] || '#cccccc';
                    
                    // 调试颜色信息
                    console.log(`更新节点 ${node.name} (level: ${level}, type: ${node.type}) 使用颜色: ${nodeColor}`);
                    
                    let nodeMesh;
                    if (node.type === 'file') {
                        // 创建三角形节点（文件）
                        nodeMesh = BABYLON.MeshBuilder.CreateCylinder(`node-${node.id}`, {
                            height: 0.3,
                            diameterTop: 0,
                            diameterBottom: size * 2,
                            tessellation: 3
                        }, scene);
                    } else {
                        // 创建球形节点（目录）
                        nodeMesh = BABYLON.MeshBuilder.CreateSphere(`node-${node.id}`, {
                            diameter: size * 2,
                            segments: 16
                        }, scene);
                    }
                    
                    // 使用保存的位置或计算新位置
                    let position;
                    if (currentPositions.has(node.id)) {
                        // 使用保存的位置，确保节点不移动
                        position = currentPositions.get(node.id);
                    } else {
                        // 新节点，计算位置
                        position = new BABYLON.Vector3(x, y, z);
                    }
                    
                    nodeMesh.position = position;
                    
                    // 创建材质
                    const material = new BABYLON.StandardMaterial(`mat-${node.id}`, scene);
                    
                    // 判断节点是否可点击
                    const isClickable = node.children > 0 && (node.level >= 2 || (node.level === 1 && hasDirectFilesInKnowledgeBase(node)));
                    
                    // 使用RGB值直接创建颜色，而不是FromHexString
                    let babylonColor;
                    if (node.type === 'file') {
                        // 紫色文件节点: #9467bd -> RGB(148, 103, 189) -> RGB(0.58, 0.40, 0.74)
                        babylonColor = new BABYLON.Color3(0.58, 0.40, 0.74);
                    } else {
                        // 根据级别设置目录颜色
                        switch(level) {
                            case 0:
                            case 1:
                                // 橙色: #ff7f0e -> RGB(255, 127, 14) -> RGB(1.0, 0.50, 0.05)
                                babylonColor = new BABYLON.Color3(1.0, 0.50, 0.05);
                                break;
                            case 2:
                                // 绿色: #2ca02c -> RGB(44, 160, 44) -> RGB(0.17, 0.63, 0.17)
                                babylonColor = new BABYLON.Color3(0.17, 0.63, 0.17);
                                break;
                            case 3:
                                // 蓝色: #1f77b4 -> RGB(31, 119, 180) -> RGB(0.12, 0.47, 0.71)
                                babylonColor = new BABYLON.Color3(0.12, 0.47, 0.71);
                                break;
                            default:
                                // 默认灰色
                                babylonColor = new BABYLON.Color3(0.8, 0.8, 0.8);
                        }
                    }
                    
                    material.diffuseColor = babylonColor;
                    material.specularColor = new BABYLON.Color3(0.2, 0.2, 0.2);
                    
                    // 可点击节点有更高的自发光，使其更明显
                    if (isClickable) {

                    }
                    
                    nodeMesh.material = material;
                    
                    // 存储节点数据
                    nodeMesh.metadata = node;
                    
                    // 创建标签
                    const labelTexture = new BABYLON.DynamicTexture(`label-${node.id}`, {width: 256, height: 64}, scene);
                    labelTexture.hasAlpha = true;
                    
                    const labelContext = labelTexture.getContext();
                    labelContext.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    labelContext.fillRect(0, 0, 256, 64);
                    labelContext.font = '20px Arial';
                    labelContext.fillStyle = 'black';
                    labelContext.textAlign = 'center';
                    labelContext.fillText(node.name, 128, 40);
                    
                    labelTexture.update();
                    
                    const labelMaterial = new BABYLON.StandardMaterial(`labelMat-${node.id}`, scene);
                    labelMaterial.diffuseTexture = labelTexture;
                    labelMaterial.emissiveColor = new BABYLON.Color3(1, 1, 1);
                    labelMaterial.backFaceCulling = false;
                    
                    const labelPlane = BABYLON.MeshBuilder.CreatePlane(`label-${node.id}`, {width: 10, height: 2.5}, scene);
                    // 使用与节点相同的位置逻辑，确保标签跟随节点
                    const labelPosition = position.clone();
                    labelPosition.y += size + 2;
                    labelPlane.position = labelPosition;
                    labelPlane.billboardMode = BABYLON.Mesh.BILLBOARDMODE_ALL;
                    labelPlane.material = labelMaterial;
                    
                    // 存储引用
                    nodeMeshes.push(nodeMesh);
                    labelMeshes.push(labelPlane);
                });
                
                // 创建连线
                newGraphData.links.forEach(link => {
                    const sourceNode = newGraphData.nodes.find(n => n.id === link.source);
                    const targetNode = newGraphData.nodes.find(n => n.id === link.target);
                    
                    if (sourceNode && targetNode) {
                        const sourceMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.source);
                        const targetMesh = nodeMeshes.find(m => m.metadata && m.metadata.id === link.target);
                        
                        if (sourceMesh && targetMesh) {
                            const line = BABYLON.MeshBuilder.CreateLines(`line-${link.source}-${link.target}`, {
                                points: [
                                    sourceMesh.position,
                                    targetMesh.position
                                ]
                            }, scene);
                            
                            const lineMaterial = new BABYLON.StandardMaterial(`lineMat-${link.source}-${link.target}`, scene);
                            lineMaterial.diffuseColor = new BABYLON.Color3(0.7, 0.7, 0.7);
                            lineMaterial.emissiveColor = new BABYLON.Color3(0.3, 0.3, 0.3);
                            line.material = lineMaterial;
                            
                            linkLines.push(line);
                        }
                    }
                });
            }
            
            // 控制按钮功能
            document.getElementById('reset-view').addEventListener('click', () => {
                camera.alpha = 0;
                camera.beta = Math.PI / 3;
                camera.radius = 100;
            });

            let linksVisible = true;
            document.getElementById('toggle-links').addEventListener('click', () => {
                linksVisible = !linksVisible;
                linkLines.forEach(line => {
                    line.setEnabled(linksVisible);
                });
            });

            let labelsVisible = true;
            document.getElementById('toggle-labels').addEventListener('click', () => {
                labelsVisible = !labelsVisible;
                labelMeshes.forEach(label => {
                    label.setEnabled(labelsVisible);
                });
            });

            // 展开所有节点
            document.getElementById('expand-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, true);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 10); // 展开到10级，相当于全部展开
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('展开所有节点时出错:', error);
                }
            });

            // 折叠所有节点
            document.getElementById('collapse-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, false);
                    
                    const newGraphData = convertToGraphData(knowledgeBase, 3); // 只显示3级
                    updateGraph(newGraphData);
                } catch (error) {
                    console.error('折叠所有节点时出错:', error);
                }
            });
            
            // 运行渲染循环
            engine.runRenderLoop(() => {
                scene.render();
            });
            
            // 处理窗口大小变化
            window.addEventListener('resize', () => {
                engine.resize();
            });
            
            // 隐藏加载消息
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
