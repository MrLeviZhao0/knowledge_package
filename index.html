        }
        
        .info-panel {
            position: absolute;
            top: 20px;

            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;

            z-index: 10;
            display: none;
        }

            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
    </style>

        // 将知识库结构转换为图形数据
        function convertToGraphData(data, maxLevel = 3) {
            const nodes = [];
            const links = [];
            let nodeId = 0;
            
            // 递归处理节点
            function processNode(node, parentId = null, visible = true) {
                const currentNodeId = `${nodeId++}`;
                const isVisible = visible && node.level <= maxLevel;
                
                // 添加节点
                nodes.push({
                    id: currentNodeId,
                    name: node.name,
                    path: node.path,
                    type: node.type,
                    level: node.level,
                    visible: isVisible,
                    parent: parentId,
                    children: node.children ? node.children.length : 0,
                    expanded: node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel) // 使用自定义展开状态
                });
                
                // 添加连接
                if (parentId !== null) {
                    links.push({
                        source: parentId,
                        target: currentNodeId,
                        visible: isVisible
                    });
                }
                
                // 处理子节点
                if (node.children) {
                    node.children.forEach(child => {
                        processNode(child, currentNodeId, isVisible && (node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel)));
                    });
                }
                
                return currentNodeId;
            }
            
            processNode(data);
            
            return { nodes, links };
        }

        // 获取图形数据
        const graphData = convertToGraphData(knowledgeBase);

        // 颜色映射
        const colorMap = {
            0: '#ff7f0e',      // 橙色 - 根节点
            1: '#ff7f0e',      // 橙色 - 一级目录
            2: '#2ca02c',      // 绿色 - 二级目录
            3: '#1f77b4',      // 蓝色 - 三级目录
            file: '#9467bd'     // 紫色 - 文件节点
        };

        // 初始化3D Force Graph
        const Graph = ForceGraph3D()
            (document.getElementById('graph-container'))
            .graphData(graphData)
            .nodeLabel('name')
            .nodeColor(node => {
                if (node.type === 'file') {
                    return colorMap.file;
                }
                return colorMap[node.level] || '#cccccc';
            })
            .nodeVal(node => {
                // 根据类型和层级设置节点大小
                if (node.type === 'file') {
                    return 3; // 文件节点较小
                }
                const sizeMap = { 0: 12, 1: 10, 2: 8, 3: 6 };
                return sizeMap[node.level] || 5;
            })
            .nodeThreeObject(node => {
                // 根据节点类型创建不同形状
                if (node.type === 'file') {
                    // 文件节点使用三角形
                    const triangle = new THREE.BufferGeometry();
                    const vertices = new Float32Array([
                        0, 1, 0,    // 顶点
                        -1, -1, 0,  // 左下角
                        1, -1, 0    // 右下角
                    ]);
                    triangle.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                    
                    const material = new THREE.MeshBasicMaterial({
                        color: colorMap.file,
                        transparent: true,
                        opacity: 0.8
                    });
                    
                    return new THREE.Mesh(triangle, material);
                } else {
                    // 目录节点使用圆形
                    const geometry = new THREE.SphereGeometry(1, 16, 16);
                    const material = new THREE.MeshBasicMaterial({
                        color: colorMap[node.level] || '#cccccc',
                        transparent: true,
                        opacity: 0.8
                    });
                    
                    return new THREE.Mesh(geometry, material);
                }
            })
            .linkColor(() => 'rgba(255,255,255,0.6)')
            .linkWidth(1)
            .onNodeClick(node => {
                if (node.type === 'file') {
                    // 文件节点，跳转到对应文档
                    // 使用相对路径，这样可以在本地文件系统中正常工作
                    window.open(node.path, '_blank');
                } else if (node.children > 0) {
                    // 目录节点，展开/折叠子节点
                    toggleNodeExpansion(node);
                }
                
                // 显示节点信息
                const nodeInfo = document.getElementById('node-info');
                document.getElementById('node-title').textContent = node.name;
                document.getElementById('node-desc').textContent = 
                    node.type === 'file' ? 
                    `文档文件: ${node.path}` : 
                    `目录节点: ${node.children} 个子项`;
                nodeInfo.style.display = 'block';
            })
            .onBackgroundClick(() => {
                // 隐藏节点信息
                document.getElementById('node-info').style.display = 'none';
            });

        // 切换节点展开/折叠状态
        function toggleNodeExpansion(node) {
            // 在知识库结构中找到对应的节点并更新其展开状态
            function findAndUpdateNode(nodeData, nodeId, path) {
                if (nodeData.path === path) {
                    nodeData.__expanded = !nodeData.__expanded;
                    return true;
                }
                
                if (nodeData.children) {
                    for (const child of nodeData.children) {
                        if (findAndUpdateNode(child, nodeId, path)) {
                            return true;
                        }
                    }
                }
                
                return false;
            }
            
            // 更新展开状态
            findAndUpdateNode(knowledgeBase, node.id, node.path);
            
            // 重新生成图形数据
            const newGraphData = convertToGraphData(knowledgeBase);
            
            // 更新图形
            Graph.graphData(newGraphData);
        }

        // 控制按钮功能
        document.getElementById('reset-view').addEventListener('click', () => {
            Graph.cameraPosition({ x: 0, y: 0, z: 500 }); // 重置视角
        });

            linksVisible = !linksVisible;
            Graph.linkOpacity(linksVisible ? 1 : 0);
        });

        let labelsVisible = true;
        document.getElementById('toggle-labels').addEventListener('click', () => {
            labelsVisible = !labelsVisible;
            Graph.nodeLabel(labelsVisible ? 'name' : '');
        });

        // 展开所有节点
        document.getElementById('expand-all').addEventListener('click', () => {
            function setAllExpanded(nodeData, expanded) {
                nodeData.__expanded = expanded;
                
                if (nodeData.children) {
                    nodeData.children.forEach(child => setAllExpanded(child, expanded));
                }
            }
            
            setAllExpanded(knowledgeBase, true);
            
            const newGraphData = convertToGraphData(knowledgeBase, 10); // 展开到10级，相当于全部展开
            Graph.graphData(newGraphData);
        });

        // 折叠所有节点
        document.getElementById('collapse-all').addEventListener('click', () => {
            function setAllExpanded(nodeData, expanded) {
                nodeData.__expanded = expanded;
                
                if (nodeData.children) {
                    nodeData.children.forEach(child => setAllExpanded(child, expanded));
                }
            }
            
            setAllExpanded(knowledgeBase, false);
            
            const newGraphData = convertToGraphData(knowledgeBase, 3); // 只显示3级
            Graph.graphData(newGraphData);
        });
    </script>
</body>
</html>
