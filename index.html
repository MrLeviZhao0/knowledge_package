<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Android知识库 3D 可视化</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        #graph-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: none;
        }
        
        .node-info h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="graph-container">
        <div id="loading-overlay">
            <div class="loader"></div>
            <div>正在加载3D可视化...</div>

    </div>

        <p>使用鼠标拖拽旋转视角，滚轮缩放，点击节点查看详细信息。</p>
        <p>圆形节点表示目录，三角形节点表示文档。</p>
        <p>点击目录节点可展开/折叠子节点，点击文档节点可跳转到对应内容。</p>

            // 将知识库结构转换为图形数据
            function convertToGraphData(data, maxLevel = 3) {
                const elements = [];
                let nodeId = 0;
                
                // 递归处理节点
                function processNode(node, parentId = null, visible = true) {
                    const currentNodeId = `node-${nodeId++}`;
                    const isVisible = visible && node.level <= maxLevel;
                    
                    // 只添加可见节点
                    if (isVisible) {
                        // 添加节点
                        elements.push({
                            data: {
                                id: currentNodeId,
                                name: node.name,
                                path: node.path,
                                type: node.type,
                                level: node.level,
                                parent: parentId,
                                children: node.children ? node.children.length : 0
                            }
                        });
                        
                        // 添加连接
                        if (parentId !== null) {
                            elements.push({
                                data: {
                                    id: `edge-${parentId}-${currentNodeId}`,
                                    source: parentId,
                                    target: currentNodeId
                                }
                            });
                        }
                    }
                    
                    // 处理子节点
                    if (node.children) {
                        node.children.forEach(child => {
                            processNode(child, isVisible ? currentNodeId : parentId, isVisible && (node.__expanded !== undefined ? node.__expanded : (node.level < maxLevel)));
                        });
                    }
                    
                    return currentNodeId;
                }
                
                processNode(data);
                
                return elements;
            }

            // 获取图形数据
            const elements = convertToGraphData(knowledgeBase);
            console.log('生成的图形数据:', elements);

            // 颜色映射
            const colorMap = {

                2: '#2ca02c',      // 绿色 - 二级目录
                3: '#1f77b4',      // 蓝色 - 三级目录
                file: '#9467bd'     // 紫色 - 文件节点
            };

            console.log('开始创建3D图形');

            // 初始化Cytoscape.js
            const cy = cytoscape({
                container: document.getElementById('graph-container'),
                elements: elements,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'label': 'data(name)',
                            'text-valign': 'center',
                            'text-halign': 'center',
                            'background-color': function(node) {
                                const type = node.data('type');
                                const level = node.data('level');
                                if (type === 'file') {
                                    return colorMap.file;
                                }
                                return colorMap[level] || '#cccccc';
                            },
                            'width': function(node) {
                                const type = node.data('type');
                                if (type === 'file') {
                                    return 30; // 文件节点较小
                                }
                                const level = node.data('level');
                                const sizeMap = { 0: 60, 1: 50, 2: 40, 3: 30 };
                                return sizeMap[level] || 25;
                            },
                            'height': function(node) {
                                const type = node.data('type');
                                if (type === 'file') {
                                    return 30; // 文件节点较小
                                }
                                const level = node.data('level');
                                const sizeMap = { 0: 60, 1: 50, 2: 40, 3: 30 };
                                return sizeMap[level] || 25;
                            },
                            'shape': function(node) {
                                const type = node.data('type');
                                return type === 'file' ? 'triangle' : 'ellipse';
                            },
                            'color': 'white',
                            'font-size': '12px',
                            'text-outline-width': 2,
                            'text-outline-color': '#000000'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'width': 2,
                            'line-color': '#dddddd',
                            'target-arrow-color': '#dddddd',
                            'target-arrow-shape': 'none'
                        }
                    }
                ],
                layout: {
                    name: 'preset',
                    positions: function(node) {
                        // 根据层级设置位置
                        const level = node.data('level');
                        const levelCount = {};
                        elements.forEach(el => {
                            if (el.data && el.data.level !== undefined) {
                                const l = el.data.level;
                                levelCount[l] = (levelCount[l] || 0) + 1;
                            }
                        });
                        
                        const levelPositions = {};
                        let currentPos = 0;
                        for (let l = 0; l <= 4; l++) {
                            levelPositions[l] = currentPos;
                            currentPos += (levelCount[l] || 0) * 50;
                        }
                        
                        const nodesInLevel = elements.filter(el => el.data && el.data.level === level);
                        const indexInLevel = nodesInLevel.findIndex(n => n.data.id === node.id());
                        
                        return {
                            x: (indexInLevel - nodesInLevel.length / 2) * 100,
                            y: level * 100
                        };
                    }
                }
            });
            
            // 切换节点展开/折叠状态

                console.log('切换节点展开状态:', node.data('name'), node.data('path'));
                
                try {
                    // 在知识库结构中找到对应的节点并更新其展开状态
                    function findAndUpdateNode(nodeData, nodeId, path) {
                        if (nodeData.path === path) {
                            nodeData.__expanded = !nodeData.__expanded;
                            console.log('更新节点展开状态:', nodeData.name, nodeData.__expanded);
                            return true;
                        }
                        
                        if (nodeData.children) {
                            for (const child of nodeData.children) {
                                if (findAndUpdateNode(child, nodeId, path)) {
                                    return true;
                                }
                            }
                        }
                        
                        return false;
                    }
                    
                    // 更新展开状态
                    findAndUpdateNode(knowledgeBase, node.id(), node.data('path'));
                    
                    // 重新生成图形数据
                    const newElements = convertToGraphData(knowledgeBase);
                    console.log('重新生成的图形数据:', newElements);
                    
                    // 更新图形
                    cy.json({ elements: newElements });
                } catch (error) {
                    console.error('切换节点展开状态时出错:', error);
                }
            }
            
            // 节点点击事件
            cy.on('tap', 'node', function(evt) {
                const node = evt.target;
                console.log('点击节点:', node.data('name'), node.data('type'));
                
                if (node.data('type') === 'file') {
                    // 文件节点，跳转到对应文档
                    window.open(node.data('path'), '_blank');
                } else if (node.data('children') > 0) {
                    // 目录节点，展开/折叠子节点
                    toggleNodeExpansion(node);
                }
                
                // 显示节点信息
                const nodeInfo = document.getElementById('node-info');
                document.getElementById('node-title').textContent = node.data('name');
                document.getElementById('node-desc').textContent = 
                    node.data('type') === 'file' ? 
                    `文档文件: ${node.data('path')}` : 
                    `目录节点: ${node.data('children')} 个子项`;
                nodeInfo.style.display = 'block';
            });
            
            // 背景点击事件
            cy.on('tap', function(evt) {
                if (evt.target === cy) {
                    // 隐藏节点信息
                    document.getElementById('node-info').style.display = 'none';
                }
            });
            
            // 控制按钮功能
            document.getElementById('reset-view').addEventListener('click', () => {
                cy.fit();
            });

            let linksVisible = true;
            document.getElementById('toggle-links').addEventListener('click', () => {
                linksVisible = !linksVisible;
                cy.style()
                    .selector('edge')
                    .style('display', linksVisible ? 'element' : 'none')
                    .update();
            });

            let labelsVisible = true;
            document.getElementById('toggle-labels').addEventListener('click', () => {
                labelsVisible = !labelsVisible;
                cy.style()
                    .selector('node')
                    .style('label', labelsVisible ? 'data(name)' : '')
                    .update();
            });

            // 展开所有节点
            document.getElementById('expand-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, true);
                    
                    const newElements = convertToGraphData(knowledgeBase, 10); // 展开到10级，相当于全部展开
                    cy.json({ elements: newElements });
                } catch (error) {
                    console.error('展开所有节点时出错:', error);
                }
            });

            // 折叠所有节点
            document.getElementById('collapse-all').addEventListener('click', () => {
                try {
                    function setAllExpanded(nodeData, expanded) {
                        nodeData.__expanded = expanded;
                        
                        if (nodeData.children) {
                            nodeData.children.forEach(child => setAllExpanded(child, expanded));
                        }
                    }
                    
                    setAllExpanded(knowledgeBase, false);
                    
                    const newElements = convertToGraphData(knowledgeBase, 3); // 只显示3级
                    cy.json({ elements: newElements });
                } catch (error) {
                    console.error('折叠所有节点时出错:', error);
                }
            });
            
            // 隐藏加载消息
            const loadingOverlay = document.getElementById('loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.style.display = 'none';
            }
        }
    </script>
</body>
</html>
