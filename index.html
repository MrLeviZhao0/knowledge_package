<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">
    <title>Android知识库 3D 可视化</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        
        #renderCanvas {
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .info-panel h2 {
            margin-top: 0;
            color: #333;
            font-size: 18px;
        }
        
        .info-panel p {
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        
        .node-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: none;
        }
        
        .node-info h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .node-info p {
            margin-bottom: 5px;
            color: #666;
            font-size: 12px;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
        }
        
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .level-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .level-indicator h3 {
            margin-top: 0;
            color: #333;
            font-size: 16px;
        }
        
        .level-indicator div {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        
        .level-indicator .shape {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }
        
        .circle {
            border-radius: 50%;
        }
        
        .triangle {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 20px solid;
        }
        
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="renderCanvas"></canvas>
    
    <div id="loading-overlay">
        <div class="loader"></div>
        <div>正在加载3D可视化...</div>
        <div style="margin-top: 10px; font-size: 14px;">如果长时间未加载，请检查浏览器控制台是否有错误信息</div>
    </div>
    
    <div class="info-panel">
        <h2>Android知识库</h2>
        <p>这是一个3D可视化展示，用于直观展示Android知识库的结构和内容。</p>
        <p>使用鼠标拖拽旋转视角，滚轮缩放，点击节点查看详细信息。</p>
        <p>圆形节点表示目录，三角形节点表示文档。</p>
        <p>初始只显示3级目录结构，点击2级及以上目录可展开所有子节点，点击文档节点可跳转到对应内容。</p>
        <p>节点标签始终可见，无需鼠标悬停。版本号: v4.1.0</p>
    </div>
    
    <div class="level-indicator">
        <h3>图例说明</h3>
        <div>
            <div class="shape circle" style="background-color: #ff7f0e;"></div>
            <span>一级目录</span>
        </div>
        <div>
            <div class="shape circle" style="background-color: #2ca02c;"></div>
            <span>二级目录</span>
        </div>
        <div>
            <div class="shape circle" style="background-color: #1f77b4;"></div>
            <span>三级目录</span>
        </div>
        <div>
            <div class="shape triangle" style="border-bottom-color: #9467bd;"></div>
            <span>文档节点</span>
        </div>
    </div>
    
    <div class="node-info" id="node-info">
        <h3 id="node-title">节点信息</h3>
        <p id="node-desc">点击节点查看详细信息</p>
    </div>
    
    <div class="controls">
        <button id="reset-view">重置视角</button>
        <button id="toggle-links">切换连线</button>
        <button id="toggle-labels">切换标签</button>
        <button id="expand-all">展开所有</button>
        <button id="collapse-all">折叠所有</button>
    </div>

    <!-- Babylon.js CDN -->
    <script src="https://cdn.babylonjs.com/babylon.js?v=20230309"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js?v=20230309"></script>
    <script src="kb_data.js"></script>
    <script src="kb_visualization.js"></script>
</body>
</html>
